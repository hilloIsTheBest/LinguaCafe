name: Build and Publish Docker images

on:
  push:
    branches: [ feature/desktop-branding ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: hilloisthebest
  WEB_IMAGE_NAME: linguacafe-webserver
  PY_IMAGE_NAME: linguacafe-python-service

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/PhpDockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.WEB_IMAGE_NAME }}:feature-desktop-branding
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.WEB_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.WEB_IMAGE_NAME }}:cache,mode=max

  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push python image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/PythonDockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.PY_IMAGE_NAME }}:feature-desktop-branding
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.PY_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.PY_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.PY_IMAGE_NAME }}:cache,mode=max

