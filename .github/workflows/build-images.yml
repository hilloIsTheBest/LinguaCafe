name: Build and Publish Docker images

on:
  push:
    branches: [ feature/desktop-branding ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: hilloisthebest
  WEB_IMAGE_NAME: linguacafe-webserver
  PY_IMAGE_NAME: linguacafe-python-service

permissions:
  contents: write
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sync composer.lock with composer.json (web)
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            php:8.2-cli bash -lc '
              set -euo pipefail
              apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates unzip zip libzip-dev >/dev/null
              docker-php-ext-install pcntl >/dev/null 2>&1 || true
              curl -sS https://getcomposer.org/installer -o /tmp/installer.php
              php /tmp/installer.php --install-dir=/usr/local/bin --filename=composer
              git config --global --add safe.directory /app
              composer update jumbojett/openid-connect-php --no-interaction --no-ansi --ignore-platform-req=ext-pcntl
            '

      - name: Commit composer.lock if changed
        run: |
          if ! git diff --quiet -- composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "chore(ci): sync composer.lock for jumbojett/openid-connect-php"
            git push
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/PhpDockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.WEB_IMAGE_NAME }}:feature-desktop-branding
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push python image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/PythonDockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.PY_IMAGE_NAME }}:feature-desktop-branding
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.PY_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
