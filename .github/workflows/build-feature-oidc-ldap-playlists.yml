name: Build feature images (oidc-ldap-playlists)

on:
  push:
    branches: [ feature/oidc-ldap-playlists ]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: hilloisthebest
  WEB_IMAGE_NAME: linguacafe-webserver
  PY_IMAGE_NAME: linguacafe-python-service

permissions:
  contents: write
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (web)
        id: meta_web
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/PhpDockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (python)
        id: meta_python
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.PY_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push python image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/PythonDockerfile
          push: true
          tags: ${{ steps.meta_python.outputs.tags }}
          labels: ${{ steps.meta_python.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

