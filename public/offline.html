<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>LinguaCafe • Offline</title>
    <meta name="theme-color" content="#C5947D">
    <link rel="icon" type="image/png" href="/icon512rounded.png">
    <style>
      html,body{height:100%}body{margin:0;background:#F2F3F5;color:#222;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
      .card{max-width:540px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:24px}
      .title{display:flex;align-items:center;font-size:20px;font-weight:600;margin:0 0 12px 0}
      .title img{width:28px;height:28px;margin-right:10px}
      .muted{color:#555;line-height:1.5}
      .row{margin-top:16px;display:flex;gap:8px}
      button{appearance:none;border:none;border-radius:10px;background:#C5947D;color:#fff;padding:10px 14px;font-weight:600}
    </style>
  </head>
  <body>
    <div class="card">
      <p class="title"><img src="/icon512rounded.png" alt="">LinguaCafe is offline</p>
      <p class="muted">You’re not connected to the internet. Some content may be unavailable. Once your connection is restored, this app will automatically refresh.</p>
      <div class="row">
        <button onclick="location.reload()">Try again</button>
      </div>
    </div>
  </body>
</html>
